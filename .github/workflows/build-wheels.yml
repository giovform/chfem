name: Build Binary Wheels

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v2.0.0

jobs:
  build_wheels:
    name: Build wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win_amd64
          - os: ubuntu-latest
            platform: manylinux2014_x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sets up MSVC (cl.exe) on Windows so nvcc can find it
      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Installs NVCC/CUDA Toolkit required by chfem_wrapper.c
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.1.1'
          method: 'network'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy Cython

      - name: Build wheel file
        run: |
          python -m pip wheel . --no-build-isolation -w dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: chfem-wheel-${{ matrix.platform }}
          path: dist/*.whl

  release:
    name: Create GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: chfem-wheel-*
          merge-multiple: true

      - name: Publish Release with Wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl