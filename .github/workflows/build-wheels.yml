name: Build Binary Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build_wheels:
    name: Build wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win_amd64
          - os: ubuntu-latest
            platform: manylinux2014_x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Configure MSVC Toolset 14.36 (compatible with CUDA 12.1)
      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.36'

      # Install CUDA Toolkit 12.1
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.1.1'
          method: 'network'

      # Suppress MSVC STL version mismatch assertion on Windows
      - name: Set NVCC Compiler Flags (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "NVCC_PREPEND_FLAGS=-Xcompiler /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" >> $env:GITHUB_ENV

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy Cython

      - name: Build wheel file
        run: |
          python -m pip wheel . --no-build-isolation -w dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: chfem-wheel-${{ matrix.platform }}
          path: dist/*.whl

  release:
    name: Create GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: chfem-wheel-*
          merge-multiple: true

      - name: Publish Release with Wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl